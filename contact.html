  <script>
    (function () {
      var d = document.documentElement, t = null, a = null, s = window.SITE || {};
      try { t = localStorage.getItem("theme"); a = localStorage.getItem("accent"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (!(s.showAccentPicker && (a === "teal" || a === "lavender"))) {
        a = s.accent === "lavender" ? "lavender" : "teal";
      }
      d.setAttribute("data-theme", t);
      d.setAttribute("data-accent", a);
    })();
  </script>
